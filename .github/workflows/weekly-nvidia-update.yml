name: 🟢 Weekly NVIDIA Section Update

on:
  schedule:
    - cron: '0 16 * * 0'  # 每週日 16:00 UTC（台北時間週一 00:00）；時間點沿用daily-update的16:00 UTC，
                           # 但星期改成UTC週日才能讓台北時間落在週一（UTC週一16:00換算台北已經是週二）
  workflow_dispatch:        # 手動備用

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest (clean tree)
        run: git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq ddgs

      - name: Run NVIDIA weekly check
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          NOTIFY_EMAIL:       ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/update_nvidia.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🟢 NVIDIA weekly check"
          file_pattern: 'data/nv_status.json data/nv_pending_review.json'
