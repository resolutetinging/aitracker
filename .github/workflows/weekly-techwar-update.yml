name: ⚔️ Weekly Tech War & Taiwan Role Update

on:
  schedule:
    - cron: '0 16 * * 6'  # 每週六 16:00 UTC（台北時間週日 00:00）；故意跟NVIDIA週查證
                           # （週日16:00 UTC＝台北週一00:00）錯開一整天，避免共用同一把
                           # GROQ_API_KEY時，兩支週排程若時間點太接近可能疊加TPM額度
  workflow_dispatch:        # 手動備用

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest (clean tree)
        run: git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq ddgs

      - name: Run tech war weekly check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/update_techwar.py

      - name: Commit updated data
        env:
          COMMIT_MSG: "⚔️ Tech war weekly check"
          FILES: 'data/techwar_status.json data/techwar_pending_review.json'
        run: |
          # 同一 repo 有多支排程會推送：push 被拒時先 rebase 到最新再推，最多 5 次
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 被拒（第 $i 次），同步最新版本後重試"
            sleep $((i * 10))
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
